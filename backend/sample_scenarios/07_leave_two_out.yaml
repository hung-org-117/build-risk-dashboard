# =============================================================================
# Scenario 7: Leave-Two-Out for Novelty Testing
# =============================================================================
# 2 language groups → Test (kiểm tra generalization lớn)
# 1 language group → Validation
# Còn lại → Train

scenario:
  name: "leave_two_out_novelty"
  description: "Leave two language groups out for extreme novelty testing"
  version: "1.0"

data_source:
  repositories:
    filter_by: "all"
  builds:
    date_range:
      start: "2024-01-01"
      end: "2024-12-31"
    conclusions: ["success", "failure"]

splitting:
  strategy: "leave_two_out"
  group_by: "language"  # Direct language grouping
  config:
    test_groups: ["python", "java"]       # Python + Java → Test
    val_groups: ["javascript"]            # JavaScript → Val
    train_groups: ["go", "rust", "typescript"]  # Rest → Train